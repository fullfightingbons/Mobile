<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AFFBC Gestion — Connexion impossible</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: #07111d;
    color: #fffdf9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 360px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .icon {
    width: 56px;
    height: 56px;
    opacity: 0.85;
  }
  h1 {
    font-size: 1.15rem;
    font-weight: 600;
    margin: 0;
  }
  p {
    font-size: 0.95rem;
    line-height: 1.5;
    color: #b7c0cc;
    margin: 0;
  }
  .retry {
    margin-top: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 12px 28px;
    border-radius: 10px;
    background: #fffdf9;
    color: #07111d;
    font-weight: 600;
    font-size: 0.95rem;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .retry:active {
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="card">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="#fffdf9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 8.82a15 15 0 0 1 20 0" opacity="0.35"/>
      <path d="M5 12.86a10 10 0 0 1 14 0" opacity="0.55"/>
      <path d="M8.5 16.43a5 5 0 0 1 7 0" opacity="0.8"/>
      <line x1="2" y1="2" x2="22" y2="22"/>
      <circle cx="12" cy="20" r="1" fill="#fffdf9" stroke="none"/>
    </svg>
    <h1>Connexion impossible</h1>
    <p>
      L'application n'a pas pu joindre le serveur du club. Vérifiez votre
      connexion internet, puis réessayez.
    </p>
    <a class="retry" href="https://gestion.americanfullfightingbons.fr">Réessayer</a>
  </div>
</body>
</html>
